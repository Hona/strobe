name: Release

# A version tag (v0.2.0) builds strobe and publishes its npm packages at Cargo.toml's version:
# @hona/strobe-<platform>-<arch> with the binaries, @hona/strobe (the `strobe` command and the bench SDK) and
# the @hona/strobe-bench alias. Windows x64 only so far. npm takes the NPM_TOKEN secret, or trusted publishing
# configured for this workflow on npmjs.com.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rust (windows-gnu, as strobe builds locally)
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          $sc = "$(rustc --print sysroot)\lib\rustlib\x86_64-pc-windows-gnu\bin\self-contained"
          echo $sc | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build
        run: cargo build --release --locked
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the tag names Cargo.toml's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="v$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "::error::tag $GITHUB_REF_NAME, Cargo.toml says $want"; exit 1; }
      - name: Publish
        run: bun scripts/release.ts --bin target/release --publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
