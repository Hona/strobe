<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>strobe calibration</title>
<style>
  html, body { margin: 0; font: 13px/18px system-ui, sans-serif; background: #fff; color: #171717 }
  #list { height: 100vh; overflow: auto }
  .row { padding: 8px 12px; border-bottom: 1px solid #e4e4e4; display: flex; gap: 12px }
  .row b { width: 60px; color: #9b9b9b; font-weight: normal; font-family: ui-monospace, monospace }
  #box { position: fixed; right: 12px; top: 12px; width: 80px; height: 80px; background: #009fff; opacity: .2 }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh }
</style>
</head>
<body>
<div id="list"></div>
<div id="box"></div>
<script>
// Known-cost workloads (SPEC §10.3). The query string picks one: ?case=busy&ms=4
const q = new URLSearchParams(location.search)
const kase = q.get("case") ?? "scroll"
const num = (k, d) => Number(q.get(k) ?? d)
const list = document.getElementById("list")
const rows = num("rows", 2000)
list.innerHTML = Array.from({ length: rows }, (_, i) => `<div class="row"><b>${i}</b><span>${"calibration row with some text to lay out ".repeat(1 + (i % 4))}</span></div>`).join("")

const spin = (ms) => { const end = performance.now() + ms; while (performance.now() < end) {} }
window.__calibration = { case: kase, frames: 0, allocated: 0, retained: [], layouts: 0, timers: 0 }

const box = document.getElementById("box")
if (kase === "busy") {
  // Exactly `ms` of JS on the main thread in every animation frame, plus one visual change so
  // every frame has something to present.
  const ms = num("ms", 4)
  const tick = (t) => { spin(ms); box.style.transform = `translateX(${-(t / 4) % 200}px)`; window.__calibration.frames++; requestAnimationFrame(tick) }
  requestAnimationFrame(tick)
}
if (kase === "layout") {
  // Exactly `k` forced layouts per frame: write a style, then read geometry.
  const k = num("k", 10)
  const tick = () => {
    for (let i = 0; i < k; i++) { box.style.width = 80 + (i % 2) + "px"; box.offsetWidth; window.__calibration.layouts++ }
    requestAnimationFrame(tick)
  }
  requestAnimationFrame(tick)
}
if (kase === "timers") {
  const n = num("n", 50)
  setInterval(() => window.__calibration.timers++, 1000 / n)
}
if (kase === "gpu") {
  // Fixed fill load: full-screen quads with alpha blending, 40 layers per frame.
  const c = document.createElement("canvas"); document.body.appendChild(c)
  c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio
  const gl = c.getContext("webgl2")
  const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); return x }
  const p = gl.createProgram()
  gl.attachShader(p, sh(gl.VERTEX_SHADER, "#version 300 es\nin vec2 a; void main(){ gl_Position = vec4(a, 0, 1); }"))
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, "#version 300 es\nprecision highp float; uniform float t; out vec4 o; void main(){ float v = 0.; for (int i = 0; i < 64; i++) v += sin(gl_FragCoord.x * .01 + float(i) + t) * cos(gl_FragCoord.y * .01 - float(i)); o = vec4(v * .01 + .5, .4, .6, .05); }"))
  gl.linkProgram(p); gl.useProgram(p)
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b)
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW)
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0)
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA)
  const u = gl.getUniformLocation(p, "t")
  const tick = (t) => { for (let i = 0; i < 40; i++) { gl.uniform1f(u, t * .001 + i); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4) } requestAnimationFrame(tick) }
  requestAnimationFrame(tick)
}
// Called by the calibration bench per run.
window.__calibrationRun = () => {
  if (kase === "alloc") {
    // Exactly `mb` MB of short-lived objects per run.
    const mb = num("mb", 8)
    let keep = 0
    for (let i = 0; i < mb * 16; i++) { const a = new Uint8Array(65536); a[i % 65536] = 1; keep += a[0] }
    window.__calibration.allocated += mb
    return keep
  }
  if (kase === "leak") {
    // Exactly `kb` KB retained per run.
    window.__calibration.retained.push(new Uint8Array(num("kb", 100) * 1024).fill(1))
  }
  return 0
}
</script>
</body>
</html>
