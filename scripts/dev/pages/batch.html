<!doctype html>
<!-- A page for batch.bench.ts: a text field, a check box, a counter and a heading the cases change and
put back (or, on purpose, do not). -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>batch</title>
    <style>
      body { margin: 16px; font: 13px/18px system-ui, sans-serif; }
      input, button { margin: 4px; }
    </style>
  </head>
  <body>
    <h1 id="title">Batch</h1>
    <input id="text" aria-label="Text" />
    <label><input type="checkbox" id="check" /> Check</label>
    <button id="add">Add</button>
    <output id="count">0</output>
    <ul id="list"></ul>
    <script>
      const count = document.getElementById("count")
      document.getElementById("add").addEventListener("click", () => {
        count.textContent = String(Number(count.textContent) + 1)
        const li = document.createElement("li")
        li.textContent = `item ${count.textContent}`
        document.getElementById("list").append(li)
      })
    </script>
  </body>
</html>
