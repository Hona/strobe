<!doctype html>
<meta charset="utf-8" />
<title>motion</title>
<style>
  #box {
    width: 120px;
    height: 120px;
    background: #009fff;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }
  /* The static path a page takes for a person who asked for less motion. */
  @media (prefers-reduced-motion: reduce) {
    #box {
      animation: none;
    }
  }
</style>
<div id="box"></div>
<p id="ready">ready</p>
