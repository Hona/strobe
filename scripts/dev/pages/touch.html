<!doctype html>
<!-- Touch input on an emulated phone: a button that marks each tap, a field, a scroller and a knob to drag. Every
trusted pointer, touch, mouse and click event is counted (`__strobeCount`, `count.<event>_<pointerType>`), and logged
in `window.seen`, so a case says what the page got from strobe's input. -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // `?fixed`: a page a person cannot zoom, so no browser waits to tell a tap from a double tap.
      if (location.search.includes("fixed")) document.querySelector("meta[name=viewport]").content += ", user-scalable=no"
    </script>
    <title>touch</title>
    <style>
      body { margin: 0; font: 13px/18px system-ui, sans-serif; }
      button { display: block; width: 200px; height: 60px; margin: 20px; }
      #field { display: block; margin: 20px; width: 200px; }
      #list { height: 300px; overflow: auto; margin: 20px; border: 1px solid #888; }
      #list div { height: 40px; border-bottom: 1px solid #ddd; }
      #pad { position: relative; height: 120px; margin: 20px; background: #eee; touch-action: none; }
      #knob { position: absolute; left: 10px; top: 40px; width: 40px; height: 40px; background: #09f; }
      #swiper { height: 80px; margin: 20px; background: #dde; }
      #tall { height: 3000px; background: linear-gradient(#fff, #ccc); }
    </style>
  </head>
  <body>
    <button id="tap">tap</button>
    <input id="field" />
    <div id="pad"><div id="knob"></div></div>
    <div id="swiper">prevents its touches</div>
    <div id="list"></div>
    <div id="tall"></div>
    <script>
      const list = document.getElementById("list")
      for (let i = 0; i < 100; i++) list.appendChild(document.createElement("div")).textContent = "row " + i
      window.seen = []
      const count = (name, n) => globalThis.__strobeCount?.(name, n)
      for (const e of ["pointerdown", "pointerup", "pointercancel", "pointermove", "touchstart", "touchend", "touchmove", "touchcancel", "mousedown", "mouseup", "mousemove", "click", "dblclick", "contextmenu"]) {
        addEventListener(e, (ev) => {
          if (!ev.isTrusted) return
          const kind = ev.pointerType ?? (e.startsWith("touch") ? "touch" : "none")
          seen.push(e + ":" + kind)
          count(e + "_" + kind)
        }, { capture: true, passive: true })
      }
      // How long after the finger lifted the click came (`count.clickdelay`, ms).
      let lifted = 0
      addEventListener("touchend", () => { lifted = performance.now() }, { capture: true, passive: true })
      addEventListener("click", () => { if (lifted) count("clickdelay", Math.round(performance.now() - lifted)); lifted = 0 }, true)
      document.getElementById("tap").addEventListener("click", (e) => { e.target.dataset.tapped = String(Number(e.target.dataset.tapped ?? 0) + 1) })
      document.getElementById("swiper").addEventListener("touchstart", (e) => e.preventDefault(), { passive: false })
      const knob = document.getElementById("knob")
      let from = null
      knob.addEventListener("pointerdown", (e) => { from = [e.clientX - knob.offsetLeft, e.pointerId]; knob.setPointerCapture(e.pointerId) })
      knob.addEventListener("pointermove", (e) => { if (from) knob.style.left = e.clientX - from[0] + "px" })
      knob.addEventListener("pointerup", () => { from = null; knob.dataset.dragged = knob.style.left })
    </script>
  </body>
</html>
