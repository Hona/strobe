<!doctype html>
<!-- Elements of every kind page.query reports (tree.bench.ts): buttons (one disabled, one covered, one in a
shadow root, one below the fold), a check box, a disclosure, a password, a select, and a hidden element. A
button is marked data-clicked when a click lands on it. -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>tree</title>
    <style>
      body { margin: 16px; font: 13px/18px system-ui, sans-serif; }
      button { height: 32px; margin: 4px; }
      button[data-clicked] { background: #cde; }
      #cover { position: relative; display: inline-block; }
      #cover::after { content: ""; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.2); }
      #below { margin-top: 3000px; }
    </style>
  </head>
  <body>
    <h1>Tree</h1>
    <nav><a href="#top" id="top-link">top</a></nav>
    <button id="one">One</button>
    <button aria-label="Second button">2</button>
    <button id="off" disabled>Off</button>
    <span id="cover"><button id="under">Under</button></span>
    <label><input type="checkbox" id="check" checked /> Checked</label>
    <button id="menu" aria-expanded="false">Menu</button>
    <details id="more"><summary>More</summary><p>Inside</p></details>
    <input type="password" id="secret" value="hunter22" aria-label="Password" />
    <select id="pick"><option>a</option><option selected>b</option></select>
    <div id="hidden" style="display: none"><button>Hidden</button></div>
    <div id="box" style="height: 40px; overflow: auto"><div style="height: 200px"></div><button id="inbox">In box</button></div>
    <x-host id="host"></x-host>
    <div id="below"><button id="far">Far</button></div>
    <script>
      for (const b of document.querySelectorAll("button, summary")) b.addEventListener("click", () => (b.dataset.clicked = "1"))
      customElements.define("x-host", class extends HTMLElement {
        connectedCallback() {
          // A deeper button at the same child position comes first: only a path anchored to the root finds Shadow.
          const root = this.attachShadow({ mode: "open" })
          root.innerHTML = "<span><i>x</i><button>Deep</button></span><button>Shadow</button>"
          for (const b of root.querySelectorAll("button")) b.addEventListener("click", () => (b.dataset.clicked = "1"))
        }
      })
    </script>
  </body>
</html>
