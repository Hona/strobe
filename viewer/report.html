<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>strobe report</title>
<style>
:root {
  --bg: #ffffff; --bg-2: #f7f7f7; --bg-3: #eeeeee;
  --fg: #171717; --fg-2: #5e5e5e; --fg-3: #8f8f8f;
  --line: #e4e4e4; --line-2: #cdcdcd;
  --accent: #009fff; --accent-bg: rgba(0, 159, 255, .10);
  --ok: #1f9d55; --warn: #c88a04; --err: #e0443e;
  --base: #8a8a8a; --head: #009fff;
  --band: rgba(0, 0, 0, .045);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111111; --bg-2: #171717; --bg-3: #1f1f1f;
    --fg: #e7e7e7; --fg-2: #a6a6a6; --fg-3: #6f6f6f;
    --line: #262626; --line-2: #383838;
    --accent-bg: rgba(0, 159, 255, .15);
    --ok: #3fb950; --warn: #d8a227; --err: #f25450;
    --base: #8c8c8c;
    --band: rgba(255, 255, 255, .055);
  }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); color: var(--fg); font: 13px/18px var(--sans); -webkit-text-size-adjust: 100%; }
body { min-width: 320px; }
button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line-2); border-radius: 0; height: 24px; padding: 0 8px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--fg-3); }
select { font: 11px/16px var(--mono); color: var(--fg); background: var(--bg); border: 1px solid var(--line-2); border-radius: 0; height: 24px; padding: 0 4px; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
code, .mono { font: 11px/16px var(--mono); }
.dim { color: var(--fg-3); }
.dim2 { color: var(--fg-2); }
.wrap { overflow-wrap: anywhere; }
.num { text-align: right; font-variant-numeric: tabular-nums; }

/* status */
.st-better { --st: var(--ok); } .st-worse { --st: var(--err); } .st-same { --st: var(--fg-2); }
.st-warn { --st: var(--warn); } .st-gated { --st: var(--fg-2); } .st-desc { --st: var(--fg-3); } .st-inconc { --st: var(--fg-3); }
.st-ok { --st: var(--ok); } .st-err { --st: var(--err); } .st-info { --st: var(--accent); }
.c-better { color: var(--ok); } .c-worse { color: var(--err); } .c-same { color: var(--fg); }
.c-warn { color: var(--warn); } .c-gated, .c-desc { color: var(--fg-3); } .c-inconc { color: var(--fg-2); }
.c-signal { color: var(--fg); font-weight: 600; }
.sq { display: inline-block; width: 8px; height: 8px; background: var(--st, var(--fg-3)); flex: none; }
.sw { display: inline-block; width: 10px; height: 10px; flex: none; }
.sw.base { background: var(--base); } .sw.head { background: var(--head); }
.badge { display: inline-block; font: 11px/14px var(--mono); padding: 0 4px; border: 1px solid var(--line-2); color: var(--fg-3); white-space: nowrap; flex: none; }
.badge.t-better { color: var(--ok); border-color: var(--ok); }
.badge.t-worse { color: var(--err); border-color: var(--err); }
.badge.t-same { color: var(--fg-2); border-color: var(--fg-3); }
.badge.t-signal { color: var(--fg-2); border-color: var(--fg-3); border-style: dashed; }
.badge.t-gated { border-style: dashed; }
.badge.t-single { border-style: dotted; }
.badge.t-warn { color: var(--warn); border-color: var(--warn); }

/* header */
header.top { position: sticky; top: 0; z-index: 20; height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { font-weight: 600; flex: none; }
.crumbs { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 0; white-space: nowrap; overflow: hidden; }
.crumbs > * { min-width: 0; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
.crumbs .id { flex: none; color: var(--fg-2); }
.crumbs .time { color: var(--fg-3); }
.tabs { display: flex; height: 40px; overflow-x: auto; flex: 0 1 auto; max-width: 50%; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { height: 40px; border: 0; border-bottom: 1px solid transparent; background: none; padding: 0 10px; color: var(--fg-2); display: flex; align-items: center; gap: 6px; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.aa { flex: none; font: 11px/16px var(--mono); color: var(--fg-2); border: 1px solid var(--line-2); padding: 0 5px; }
.jumps { display: flex; align-items: center; flex: none; color: var(--line-2); }
.jumps button { border: 0; background: none; height: 40px; padding: 0 5px; color: var(--fg-3); }
.jumps button:hover { color: var(--accent); }
.toggle { flex: none; color: var(--fg-2); }
.toggle[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-bg); }
@media (max-width: 1250px) { .crumbs .time { display: none; } }
@media (max-width: 760px) { .jumps, .crumbs .file { display: none; } }

/* layout */
main { max-width: 1600px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
.sec { scroll-margin-top: 56px; }
.grid3 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.env-col { display: grid; gap: 16px; min-width: 0; }
.env-2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .env-2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 1100px) { .grid3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .grid3 > :first-child { grid-column: 1 / -1; } }
@media (max-width: 700px) { .grid3 { grid-template-columns: minmax(0, 1fr); } }
.alert { border: 1px solid var(--warn); background: var(--bg); padding: 8px 12px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.alert .act { margin-left: auto; }
.panel { border: 1px solid var(--line); background: var(--bg); min-width: 0; container-type: inline-size; }
.ph { display: flex; align-items: center; gap: 4px 10px; min-height: 35px; padding: 4px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.ph h2 { font-size: 13px; line-height: 18px; font-weight: 600; }
.ph .sub { color: var(--fg-3); min-width: 0; }
.ph .ctl { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pb { padding: 12px; }
.pb.flush { padding: 0; }
.seg { display: inline-flex; border: 1px solid var(--line-2); }
.seg button { border: 0; height: 22px; padding: 0 8px; background: transparent; color: var(--fg-2); }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); }
.btns { display: inline-flex; gap: 4px; }
.btns button { height: 24px; min-width: 26px; padding: 0 7px; color: var(--fg-2); }
.chart { position: relative; width: 100%; overflow: hidden; }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; color: var(--fg-3); }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 330px) minmax(215px, 275px); border-top-color: var(--st); }
.hero > * { padding: 10px 16px; min-width: 0; }
.hero-metric { display: flex; gap: 6px; align-items: baseline; color: var(--fg-2); flex-wrap: wrap; }
.hero-metric .plain { color: var(--fg); font-weight: 600; }
.hero-line { display: flex; gap: 2px 12px; align-items: baseline; flex-wrap: wrap; }
.hero-word, .hero-num { font-size: 22px; line-height: 32px; font-weight: 600; letter-spacing: -.01em; }
.hero-num { font-variant-numeric: tabular-nums; }
.hero-num.open { color: var(--fg-2); font-weight: 400; font-size: 16px; }
.hero-tag { color: var(--fg-2); border: 1px solid var(--line-2); padding: 0 6px; align-self: center; }
.chip { font-size: 15px; line-height: 24px; color: var(--fg-2); border: 1px solid var(--fg-3); padding: 0 8px; align-self: center; }
.chip.warn { color: var(--warn); border-color: var(--warn); }
.audit { color: var(--fg-3); margin-top: 2px; }
.hero-ci, .hero-vals { border-left: 1px solid var(--line); }
.hero-ci .ci-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.hero-vals { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 4px 10px; align-content: center; align-items: baseline; }
.hero-vals dt { color: var(--fg-3); display: flex; align-items: center; gap: 6px; }
.hero-vals dd { min-width: 0; overflow-wrap: anywhere; }
.hero-vals .v { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
@media (max-width: 1050px) {
  .hero { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .hero-main { grid-column: 1 / -1; }
  .hero-ci { border-left: 0; border-top: 1px solid var(--line); }
  .hero-vals { border-top: 1px solid var(--line); }
}

/* feel */
.feel { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); }
.card { padding: 8px 12px 10px; min-width: 0; border-left: 1px solid var(--line); display: grid; align-content: start; }
.card:first-child { border-left: 0; }
@media (max-width: 1150px) {
  .feel { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card:nth-child(3) { border-left: 0; }
  .card:nth-child(n+3) { border-top: 1px solid var(--line); }
}
.ct { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ct .cn { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ct .star { color: var(--accent); font-weight: 400; }
.cbig { display: flex; align-items: baseline; gap: 8px; min-width: 0; margin-top: 2px; }
.big { font-size: 20px; line-height: 28px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.big.muted { color: var(--fg-3); font-weight: 400; font-size: 16px; }
.cbig svg { margin-left: auto; align-self: center; flex: none; }
.cap { color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
.srow { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 6px; align-items: center; min-height: 22px; border-top: 1px solid var(--line); }
.srow .sl { color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .sv { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* moves and why */
.chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@container (max-width: 860px) { .chips { grid-template-columns: minmax(0, 1fr); } }
.mchip { border: 1px solid var(--line); padding: 8px 10px 6px; display: grid; gap: 2px; min-width: 0; }
.mval { display: flex; align-items: baseline; gap: 8px; min-width: 0; white-space: nowrap; }
.mval .mv { font-size: 15px; line-height: 22px; font-weight: 600; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
.why-h { border-top: 1px solid var(--line); }
.wnote { padding: 6px 12px; color: var(--fg-2); border-bottom: 1px solid var(--line); background: var(--bg-2); }
.wrow { display: grid; grid-template-columns: minmax(0, 1.5fr) 150px minmax(120px, 2fr) 96px; column-gap: 12px; align-items: center; min-height: 24px; padding: 0 12px; border-top: 1px solid var(--line); }
.wrow.wh { color: var(--fg-3); border-top: 0; min-height: 22px; }
.wname { display: flex; gap: 8px; min-width: 0; align-items: baseline; }
.wname .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
.wname .w { color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
.wbar { position: relative; height: 24px; }
.wbar i { position: absolute; display: block; }
.wbar .z { left: 50%; top: 3px; bottom: 3px; width: 1px; background: var(--fg-3); }
.wbar .bar { top: 7px; height: 10px; background: var(--accent); }
.wbar .bar.more { background: var(--fg-2); }
.wsys { padding: 6px 12px 8px; color: var(--fg-3); border-top: 1px solid var(--line); }
@container (max-width: 760px) { .wrow { grid-template-columns: minmax(0, 1fr) minmax(90px, 1fr) 84px; } .wrow .wv { display: none; } }

/* evidence */
.evi { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 10px 12px; }
@container (max-width: 820px) { .evi { grid-template-columns: minmax(0, 1fr); } }
.evi-t { color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.readout { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; padding-top: 4px; min-height: 22px; }
.readout b { font-weight: 600; }

/* frame timing */
.ft { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(250px, 1fr); gap: 24px; align-items: start; padding: 10px 12px; }
@container (max-width: 860px) { .ft { grid-template-columns: minmax(0, 1fr); } }
.ft-t { color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
.ftrow { display: grid; grid-template-columns: 46px minmax(0, 1fr) 114px 140px; gap: 10px; align-items: center; height: 26px; }
.ftrow.nozoom { grid-template-columns: 46px minmax(0, 1fr) 114px; }
.ftrow > span:first-child { display: flex; align-items: center; gap: 6px; color: var(--fg-2); }
.stack { display: flex; height: 14px; border: 1px solid var(--line-2); background: var(--bg-3); overflow: hidden; }
.stack i { display: block; height: 100%; flex: none; }
.k0 { background: rgba(128, 128, 128, .28); } .k1 { background: var(--fg-3); } .k2 { background: var(--fg-2); } .k3 { background: var(--fg); }
.ft .legend { margin-top: 4px; }
.stub .ph { border-bottom: 0; }

/* metric table */
details.panel > summary { list-style: none; cursor: pointer; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel:not([open]) > summary { border-bottom: 0; }
.caret { display: inline-block; width: 10px; color: var(--fg-3); transition: transform .12s; }
details[open] .caret { transform: rotate(90deg); }
.mt-ctl { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; padding: 6px 12px; border-bottom: 1px solid var(--line); }
.mt-ctl .seg { margin-left: auto; }
.forest { --fcols: minmax(200px, 1.5fr) 66px 66px 64px minmax(140px, 2.3fr) 146px 84px minmax(96px, .9fr) 136px; }
@container (max-width: 1080px) {
  .forest { --fcols: minmax(170px, 1.3fr) 64px 64px 60px minmax(120px, 2fr) minmax(96px, 1fr) 130px; }
  .forest .c-ci, .forest .c-spark { display: none; }
}
@container (max-width: 720px) {
  .forest { --fcols: minmax(140px, 1.2fr) 60px minmax(100px, 2fr) 124px; }
  .forest .c-base, .forest .c-head, .forest .c-verdict { display: none; }
}
.frow { display: grid; grid-template-columns: var(--fcols); align-items: center; min-height: 28px; column-gap: 10px; padding: 0 12px 0 11px; border-top: 1px solid var(--line); border-left: 1px solid transparent; cursor: pointer; }
.frow:hover { background: var(--bg-2); }
.frow.focus { background: var(--bg-2); border-left-color: var(--accent); }
.frow.focus .name { color: var(--accent); }
.frow.desc { color: var(--fg-3); }
.frow.desc .track { opacity: .55; }
.fhead { cursor: default; color: var(--fg-3); min-height: 30px; border-top: 0; }
.fhead:hover { background: none; }
.fgroup { padding: 10px 12px 4px; color: var(--fg-3); border-top: 1px solid var(--line); }
.c-metric { display: flex; gap: 6px; align-items: baseline; min-width: 0; overflow: hidden; }
.c-metric .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; }
.c-metric .mcode { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 2 auto; color: var(--fg-3); }
.star { width: 10px; flex: none; color: var(--accent); }
.c-bar { position: relative; align-self: stretch; min-height: 28px; }
.c-ci { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-verdict { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-verdict .vt { color: var(--fg-3); }
.c-spark svg { display: block; }
.track { position: absolute; top: 0; bottom: 0; left: 8px; right: 8px; }
.track i { position: absolute; display: block; }
.track .band { top: 5px; bottom: 5px; background: var(--band); border-left: 1px dashed var(--line-2); border-right: 1px dashed var(--line-2); }
.track .zero { top: 3px; bottom: 3px; width: 1px; background: var(--fg-3); }
.track .ci { top: 50%; height: 2px; margin-top: -1px; background: var(--st); }
.track .cap { top: 50%; height: 10px; width: 1px; margin-top: -5px; background: var(--st); }
.track .arrow { top: 50%; width: 6px; height: 9px; margin-top: -4.5px; background: var(--st); }
.track .arrow.l { clip-path: polygon(0 50%, 100% 0, 100% 100%); }
.track .arrow.r { clip-path: polygon(0 0, 100% 50%, 0 100%); margin-left: -6px; }
.track .dot { top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--st); }
.st-gated .track .dot, .st-desc .track .dot, .st-inconc .track .dot { background: var(--bg); border: 1px solid var(--st); }
.track .scale { right: 0; bottom: 1px; font: 9px/10px var(--mono); color: var(--fg-3); background: var(--bg); padding-left: 3px; }
.axis .track span { position: absolute; top: 50%; transform: translate(-50%, -50%); font: 10px/1 var(--mono); color: var(--fg-3); white-space: nowrap; }
.forest .legend { padding: 8px 12px; border-top: 1px solid var(--line); }

/* distributions */
.dist { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
@container (max-width: 820px) { .dist { grid-template-columns: minmax(0, 1fr); } }
table.pct { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.pct th, table.pct td { padding: 3px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; font-weight: 400; }
table.pct th:first-child, table.pct td:first-child { text-align: left; color: var(--fg-3); padding-left: 0; }
table.pct thead th { color: var(--fg-3); }
table.pct td.b { color: var(--fg-2); }
table.pct td.h { color: var(--fg); }
.note { color: var(--fg-3); margin-top: 8px; }

/* env, warnings, commands */
dl.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; }
dl.kv dt { color: var(--fg-3); white-space: nowrap; }
dl.kv dd { min-width: 0; overflow-wrap: anywhere; }
.topo { display: flex; gap: 10px; flex-wrap: wrap; }
.topo .grp { display: grid; gap: 3px; }
.topo .cells { display: flex; flex-wrap: wrap; gap: 2px; max-width: 160px; }
.topo .cell { width: 8px; height: 8px; border: 1px solid var(--line-2); }
.topo .cell.on { background: var(--accent); border-color: var(--accent); }
ul.warns { list-style: none; display: grid; gap: 8px; }
ul.warns li { display: grid; grid-template-columns: 8px minmax(0, auto) minmax(0, 1fr); gap: 4px 10px; align-items: baseline; }
ul.warns li .sq { position: relative; top: -1px; }
ul.warns li .wid { color: var(--fg-2); }
.cmds { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.cmds > div { min-width: 0; }
.cmd-about { color: var(--fg-3); margin-bottom: 2px; }
.cmd-line { display: flex; border: 1px solid var(--line); background: var(--bg-2); min-width: 0; }
.cmd-line code { flex: 1; padding: 4px 8px; overflow-x: auto; white-space: nowrap; scrollbar-width: thin; }
.cmd-line .copy { border: 0; border-left: 1px solid var(--line); height: auto; background: none; color: var(--fg-2); }
.cmd-line .copy.done { color: var(--ok); }
details.more-cmds { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
details.more-cmds > summary { list-style: none; cursor: pointer; color: var(--fg-2); margin-bottom: 6px; }
details.more-cmds > summary::-webkit-details-marker { display: none; }

/* recording */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 0; border-top: 1px solid var(--line); }
.tile { padding: 10px 12px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; min-width: 0; }
.tile .k { color: var(--fg-3); }
.tile .v { font-size: 20px; line-height: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .s { color: var(--fg-3); }
.gauge { height: 4px; background: var(--bg-3); margin-top: 6px; position: relative; }

</style>
</head>
<body>
<div id="app"></div>
<div id="tip" role="tooltip" hidden></div>
<script>
const STROBE = /*STROBE_DATA*/null

const app = document.getElementById("app")
const tip = document.getElementById("tip")
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches
const finite = Number.isFinite
const state = {
  series: 0,
  focus: null,
  axis: "near",
  k: null,
  hoverK: null,
  hoverFrom: null,
  text: false,
  showDist: false,
  metricsOpen: false,
  whyBy: "fn",
  dist: { kind: "gaps", mode: "cdf", y: "linear", range: "p99", pooled: true, phase: "" },
}
let observers = []
let linked = []
let timer = null

/* ---------- dom ---------- */

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag)
  setAttrs(e, attrs)
  append(e, kids)
  return e
}

function S(tag, attrs, ...kids) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag)
  setAttrs(e, attrs)
  append(e, kids)
  return e
}

function setAttrs(e, attrs) {
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue
    if (k === "style") e.style.cssText = v
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v)
    else e.setAttribute(k, v === true ? "" : String(v))
  }
}

function append(e, kids) {
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false) continue
    e.append(k instanceof Node ? k : String(k))
  }
}

const T = (x, y, str, cls, anchor) => S("text", { x, y, class: cls, "text-anchor": anchor }, str)
const L = (x1, y1, x2, y2, cls, extra) => S("line", { x1, y1, x2, y2, class: cls, ...extra })

function chart(height, draw, cls) {
  const box = h("div", { class: "chart" + (cls ? " " + cls : ""), style: `height:${height}px` })
  let width = 0
  box.paint = () => {
    if (width > 0) box.replaceChildren(draw(width))
  }
  box.measure = () => {
    width = Math.floor(box.clientWidth)
    box.paint()
  }
  const ro = new ResizeObserver((entries) => {
    if (!box.isConnected) return ro.disconnect()
    const w = Math.floor(entries[0].contentRect.width)
    if (w === width) return
    width = w
    box.paint()
  })
  ro.observe(box)
  observers.push(ro)
  return box
}

function panel(title, sub, ctl, body, opts) {
  return h("section", { class: "panel" + (opts?.cls ? " " + opts.cls : ""), id: opts?.id },
    h("div", { class: "ph" }, h("h2", {}, title), sub ? h("span", { class: "sub" }, sub) : null, ctl && ctl.length ? h("div", { class: "ctl" }, ctl) : null),
    h("div", { class: "pb" + (opts?.flush ? " flush" : "") }, body))
}

function seg(key, options, value, pick, label) {
  return h("div", { class: "seg", role: "group", "aria-label": label },
    options.map(([v, text, title]) => h("button", { type: "button", title, "data-key": `${key}:${v}`, "aria-pressed": String(v === value), onclick: () => pick(v) }, text)))
}

/* ---------- tooltip ---------- */

function showTip(e, title, rows) {
  tip.replaceChildren(
    h("div", { class: "tt" }, title),
    h("table", {}, rows.filter(Boolean).map(([k, v, cls]) => h("tr", {}, h("th", {}, k), h("td", { class: cls }, v)))))
  tip.hidden = false
  moveTip(e)
}

function moveTip(e) {
  if (tip.hidden) return
  const r = tip.getBoundingClientRect()
  const x = e.clientX + 14 + r.width > innerWidth - 4 ? e.clientX - 14 - r.width : e.clientX + 14
  const y = e.clientY + 14 + r.height > innerHeight - 4 ? e.clientY - 14 - r.height : e.clientY + 14
  tip.style.left = Math.max(4, x) + "px"
  tip.style.top = Math.max(4, y) + "px"
}

function hideTip() {
  tip.hidden = true
}

function bindTip(el, fn) {
  el.addEventListener("pointerenter", (e) => showTip(e, ...fn()))
  el.addEventListener("pointermove", moveTip)
  el.addEventListener("pointerleave", hideTip)
  return el
}

addEventListener("scroll", hideTip, { passive: true })

/* ---------- metrics ---------- */

const CATALOG = new Map((STROBE?.metrics || []).map((m) => [m.name, m]))

const MIN_N_FALLBACK = {
  "frames.presented.p50": 20, "frames.presented.p90": 100, "frames.presented.p95": 200, "frames.presented.p99": 1000,
  "frames.interval.p50": 20, "frames.interval.p95": 200, "frames.interval.p99": 1000, "scroll.latency.p95": 20,
}

const minNOf = (name) => CATALOG.get(name)?.min_n ?? MIN_N_FALLBACK[name] ?? 0

function unitOf(name) {
  const cat = CATALOG.get(name)?.unit
  if (cat) return cat
  if (name === "display.hz") return "Hz"
  if (name === "run.duration" || name === "main.work") return "ms"
  if (/^(frames|interaction|scroll)\./.test(name) && /\.(p50|p90|p95|p99|max)$/.test(name)) return "ms"
  if (name === "frames.dropped.pct" || name === "main.busy" || name.startsWith("cpu.") || name === "gpu.process.3d") return "%"
  if (name.startsWith("memory.") || name === "gpu.vram" || name === "js.heap.used") return "MB"
  return "count"
}

const higherBetter = (name) => (CATALOG.get(name)?.better ? CATALOG.get(name).better === "higher" : name === "frames.presented.count")
const absUnit = (u, plain) => (u === "%" ? (plain ? "pts" : "pp") : u)

function wordsOf(name) {
  const cat = CATALOG.get(name)?.words
  if (cat?.length === 2) return cat
  if (name === "frames.presented.count") return ["more", "fewer"]
  if (name.startsWith("frames.interval.") || name === "frames.dropped.pct") return ["smoother", "choppier"]
  if (unitOf(name) === "ms") return ["faster", "slower"]
  if (unitOf(name) === "count") return ["fewer", "more"]
  return ["less", "more"]
}

const NAME = {
  "frames.dropped.pct": "dropped frames %",
  "frames.dropped": "dropped frames",
  "frames.partial": "partial frames",
  "frames.presented.count": "presented frames",
  "frames.interval.p50": "frame gap p50",
  "frames.interval.p95": "frame gap p95",
  "frames.interval.p99": "frame gap p99",
  "frames.interval.max": "max frame gap",
  "frames.presented.p50": "frame render p50",
  "frames.presented.p90": "frame render p90",
  "frames.presented.p95": "frame render p95",
  "frames.presented.p99": "frame render p99",
  "frames.presented.max": "max frame render",
  "interaction.p50": "input → screen p50",
  "interaction.p95": "input → screen p95",
  "scroll.latency.p95": "scroll → screen p95",
  "run.duration": "task duration",
  "main.work": "main-thread work",
  "main.busy": "main-thread busy %",
  "main.tasks.long": "long tasks (>50 ms)",
  "cpu.app.total": "all-process CPU",
  "cpu.process.total": "all-process CPU",
  "memory.app.private": "app memory (RAM)",
  "js.heap.used": "JS heap",
  "gpu.vram": "GPU VRAM",
  "gpu.process.3d": "GPU 3D engine",
  "dom.nodes": "DOM nodes",
}
const nameOf = (m) => NAME[m] || m

const ABOUT_FALLBACK = {
  "frames.dropped.pct": "share of display refreshes with pending work that presented no frame",
  "frames.interval.p95": "95th percentile time between presented frames while animating (stutter)",
  "interaction.p95": "time from discrete input to screen presentation, 95th percentile",
  "main.work": "renderer main-thread task time per run (unquantized CPU cost)",
  "main.busy": "share of run time the renderer main thread spent in tasks",
  "run.duration": "wall-clock duration of one run",
  "cpu.app.total": "total CPU across all target processes during runs (% of 1 CPU core)",
  "memory.app.private": "private RAM across all target processes after measured runs",
  "js.heap.used": "renderer V8 JS heap in use after measured runs",
}
const aboutOf = (m) => (m === "main.work" ? ABOUT_FALLBACK[m] : CATALOG.get(m)?.about || ABOUT_FALLBACK[m] || null)

/* ---------- numbers ---------- */

function fmtValue(v, u) {
  if (!finite(v)) return "—"
  const d = Math.abs(v) >= 100 ? 0 : Math.abs(v) >= 10 ? 1 : 2
  if (u === "ms") return v.toFixed(d) + " ms"
  if (u === "%") return v.toFixed(d) + "%"
  if (u === "pp") return v.toFixed(d) + " pp"
  if (u === "pts") return v.toFixed(d) + " pts"
  if (u === "count") return Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : v.toFixed(1)
  if (u === "MB") return v.toFixed(0) + " MB"
  if (u === "Hz") return v.toFixed(0) + " Hz"
  return v.toFixed(d) + (u ? " " + u : "")
}

// Match absolute delta precision to the displayed base/head precision so "260 ms -> 250 ms" never prints "-10.2 ms" or "3.37 ms".
function fmtReal(v, ref, u, plain) {
  if (!finite(v)) return "—"
  const au = absUnit(u, plain)
  if (au === "MB" || au === "Hz") return Math.abs(v).toFixed(0) + " " + au
  if (au === "count") return Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(Math.abs(v))) : Math.abs(v).toFixed(1)
  const scale = finite(ref) ? Math.abs(ref) : Math.abs(v)
  const d = scale >= 100 ? (Math.abs(v) < 10 ? 1 : 0) : scale >= 10 ? (Math.abs(v) < 1 ? 2 : 1) : 2
  return Math.abs(v).toFixed(d) + " " + au
}

function fmtSignedReal(v, ref, u, plain) {
  if (!finite(v)) return "—"
  const body = fmtReal(v, ref, u, plain)
  return v < 0 ? "−" + body : v > 0 ? "+" + body : body
}

const fmtNum = (v, u) => fmtValue(v, u).replace(/\s*(ms|MB|Hz|pp|pts|%)$/, "")
const fmtMove = (a, b, u) => `${fmtNum(a, u)} → ${fmtValue(b, u)}`

function fmtPct(r) {
  if (!finite(r)) return "—"
  const p = r * 100
  const body = Math.abs(p) < 10 ? Math.abs(p).toFixed(1) : Math.abs(p).toFixed(0)
  return (p < -0.05 ? "−" : p > 0.05 ? "+" : "") + body + "%"
}

function fmtSigned(v, u) {
  if (!finite(v)) return "—"
  const body = fmtValue(Math.abs(v), u)
  return v < 0 ? "−" + body : v > 0 ? "+" + body : body
}

const fmtDelta = (v, c, u, plain) => (c.relative ? fmtPct(v) : fmtSigned(v, absUnit(u, plain)))

// Guards top-half cards against visual contradictions when unpaired launch medians tie or flip sign against a noisy paired estimate.
function coherentDelta(c, u, plain) {
  const raw = fmtDelta(c.estimate, c, u, plain)
  if (!finite(c.base) || !finite(c.head) || !finite(c.estimate)) return { text: raw, noisy: false }
  const clear = c.decided || c.lo > 0 || c.hi < 0
  if (clear) return { text: raw, noisy: false }
  const tied = fmtValue(c.base, u) === fmtValue(c.head, u)
  const flipped = c.head !== c.base && Math.sign(c.head - c.base) !== Math.sign(c.estimate) && Math.abs(c.estimate) >= 0.005
  if (tied && Math.abs(c.estimate) >= 0.01) return { text: "~0%", noisy: true, raw }
  if (flipped) return { text: "noisy", noisy: true, raw }
  return { text: raw, noisy: false }
}

function fmtCI(c, u, sep = " … ", plain = false) {
  if (!finite(c.lo) || !finite(c.hi)) return "—"
  return `${fmtDelta(c.lo, c, u, plain)}${sep}${fmtDelta(c.hi, c, u, plain)}`
}

const fmtBound = (c, u, plain) => (c.relative ? `±${num(+(c.bound * 100).toPrecision(3))}%` : `±${fmtValue(c.bound, absUnit(u, plain))}`)
const fmtP = (p) => (!finite(p) ? "—" : p < 0.001 ? "<0.001" : p < 0.1 ? p.toFixed(3) : p.toFixed(2))
const num = (v) => String(parseFloat((+v).toPrecision(10)))
const short = (v) => (!finite(v) ? "—" : Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2))
const pctTick = (v) => (v === 0 ? "0" : (v > 0 ? "+" : "−") + num(Math.abs(v)) + "%")
const signedTick = (v, u) => (v === 0 ? "0" : (v > 0 ? "+" : "−") + num(Math.abs(v)) + (u === "count" ? "" : " " + u))
const fmtShare = (f) => (!finite(f) ? "—" : (f * 100).toFixed(f < 0.1 ? 2 : 1) + "%")

function niceTicks(lo, hi, n) {
  if (!(hi > lo)) return [lo]
  const raw = (hi - lo) / Math.max(1, n)
  const mag = 10 ** Math.floor(Math.log10(raw))
  const f = raw / mag
  const step = (f >= 7.5 ? 10 : f >= 3.5 ? 5 : f >= 1.5 ? 2 : 1) * mag
  const out = []
  for (let i = Math.ceil(lo / step - 1e-9); i * step <= hi + step * 1e-9; i++) out.push(i === 0 ? 0 : +(i * step).toPrecision(12))
  return out
}

function lin(d0, d1, r0, r1) {
  const k = (r1 - r0) / (d1 - d0 || 1)
  const f = (v) => r0 + (v - d0) * k
  f.inv = (p) => d0 + (p - r0) / k
  return f
}

function quant(sorted, p) {
  if (!sorted.length) return NaN
  const i = (sorted.length - 1) * p
  const lo = Math.floor(i)
  const hi = Math.ceil(i)
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo)
}

function median(values) {
  return quant(values.filter(finite).sort((a, b) => a - b), 0.5)
}

function upper(sorted, x) {
  let lo = 0
  let hi = sorted.length
  while (lo < hi) {
    const m = (lo + hi) >> 1
    if (sorted[m] <= x) lo = m + 1
    else hi = m
  }
  return lo
}

function pooledSorted(arrays) {
  const out = new Float64Array(arrays.reduce((n, a) => n + a.length, 0))
  let i = 0
  for (const a of arrays) {
    out.set(a, i)
    i += a.length
  }
  return out.sort()
}

/* ---------- statistics (ports of src/stats.rs) ---------- */

const rankCache = new Map()
function signedRankCounts(n) {
  if (rankCache.has(n)) return rankCache.get(n)
  const max = (n * (n + 1)) / 2
  const c = new Float64Array(max + 1)
  c[0] = 1
  for (let k = 1; k <= n; k++) for (let s = max; s >= k; s--) c[s] += c[s - k]
  rankCache.set(n, c)
  return c
}

// Two-sided normal quantile for the large-n branch (Acklam's approximation, as src/stats.rs).
function zOf(alpha) {
  const p = 1 - alpha / 2
  const q = p - 0.5
  if (Math.abs(q) <= 0.47575) {
    const r = q * q
    return (((((-39.69683028665376 * r + 220.9460984245205) * r - 275.9285104469687) * r + 138.357751867269) * r - 30.66479806614716) * r + 2.506628277459239) * q / (((((-54.47609879822406 * r + 161.5858368580409) * r - 155.6989798598866) * r + 66.80131188771972) * r - 13.28068155288572) * r + 1)
  }
  const t = Math.sqrt(-2 * Math.log(1 - p))
  return -(((((-0.007784894002430293 * t - 0.3223964580411365) * t - 2.400758277161838) * t - 2.549732539343734) * t + 4.374664141464968) * t + 2.938163982698783) / ((((0.007784695709041462 * t + 0.3224671290700398) * t + 2.445134137142996) * t + 3.754408661907416) * t + 1)
}

function hodgesLehmann(d, alpha = 0.05) {
  const v = d.filter(finite)
  const n = v.length
  if (!n) return null
  const walsh = []
  for (let i = 0; i < n; i++) for (let j = i; j < n; j++) walsh.push((v[i] + v[j]) / 2)
  walsh.sort((a, b) => a - b)
  const m = walsh.length
  const est = m % 2 ? walsh[(m - 1) / 2] : (walsh[m / 2 - 1] + walsh[m / 2]) / 2
  let c = -1
  if (n <= 50) {
    const counts = signedRankCounts(n)
    const total = 2 ** n
    let acc = 0
    for (let k = 0; k < counts.length; k++) {
      if ((acc + counts[k]) / total > alpha / 2) break
      acc += counts[k]
      c = k
    }
  } else {
    c = Math.max(0, Math.floor((n * (n + 1)) / 4 - zOf(alpha) * Math.sqrt((n * (n + 1) * (2 * n + 1)) / 24) - 0.5))
  }
  // [W(c), W(m-1-c)] covers 1 - 2·P(T <= c); with no valid c the level is out of reach and [min, max] is shown (src/stats.rs).
  const clamp = (i) => Math.max(0, Math.min(m - 1, i))
  const loI = clamp(Math.max(c, 0))
  const hiI = clamp(m - 1 - Math.max(c, 0))
  return { est, lo: walsh[Math.min(loI, hiI)], hi: walsh[Math.max(loI, hiI)], covered: c >= 0 }
}

// The primary's per-look level: Pocock across planned looks (src/app/bench.rs); everything else 95%.
const levelOf = (metric, s) => (metric === s?.primary?.metric ? STROBE?.data?.plan?.alpha ?? 0.05 : 0.05)
const ciPct = (metric, s) => +(100 * (1 - levelOf(metric, s))).toFixed(1)
const ciLabel = (metric, s) => `${ciPct(metric, s)}% CI`
const isAA = () => !!STROBE?.data?.plan?.aa

function compareAt(metric, ps, bound, relative, alpha = 0.05) {
  const d = ps.map((p) => (relative ? Math.log(p.b / p.a) : p.b - p.a)).filter(finite)
  const hl = hodgesLehmann(d, alpha)
  if (!hl) return null
  const t = relative ? (x) => Math.exp(x) - 1 : (x) => x
  const est = t(hl.est)
  const lo = t(hl.lo)
  const hi = t(hl.hi)
  const boundAbs = relative ? bound : Math.max(bound * Math.abs(median(ps.map((p) => p.a))), 0.5)
  const words = wordsOf(metric)
  let verdict = "unclear"
  // An interval that cannot reach its level gets no verdict (src/stats.rs `covered`): below 6 pairs at 95%.
  if (hl.covered && finite(est)) {
    if (hi < 0 || lo > 0) {
      const word = (hi < 0) === !higherBetter(metric) ? words[0] : words[1]
      const small = hi < 0 ? hi > -boundAbs : lo < boundAbs
      verdict = small ? `${word} (small)` : word
    } else if (lo > -boundAbs && hi < boundAbs) {
      verdict = `same (±${relative ? Math.round(bound * 100) + "%" : boundAbs.toFixed(1)})`
    }
  }
  const minN = minNOf(metric)
  if (minN > 1) {
    const least = Math.min(...ps.flatMap((p) => [p.base.values?.["frames.n"] ?? 0, p.head.values?.["frames.n"] ?? 0]))
    if (least < minN) verdict = `refused: ${least} frames < ${minN}`
  }
  return { n: d.length, est, lo, hi, bound: boundAbs, relative, verdict }
}

/* ---------- verdicts ---------- */

function vclass(c, metric, aa = isAA()) {
  const v = c?.verdict ?? ""
  if (v === "·") return "desc"
  if (v === "—" || !v) return "gated"
  if (v.startsWith("same")) return "same"
  if (/^refused/.test(v)) return "warn"
  if (/^(unclear|underpowered)/.test(v)) return "inconc"
  if (!(c.hi < 0 || c.lo > 0)) return "inconc"
  if (aa) return "warn"
  return (c.hi < 0) !== higherBetter(metric) ? "better" : "worse"
}

function vsplit(v) {
  const m = /^([^(:]+?)\s*(?:\((.*)\)|:\s*(.*))?$/.exec(v || "")
  return m ? [m[1], m[2] || m[3] || ""] : [v || "", ""]
}

function cleanVerdict(v) {
  if (!v) return "inconclusive"
  const [word, tag] = vsplit(v)
  if (word === "underpowered" || word === "unclear") return tag ? `inconclusive (${tag})` : "inconclusive"
  if (tag === "small") return `${word} (near ±2%)`
  return v
}

function verdictLabel(c, cls) {
  if (cls === "gated") return h("span", { title: "unconfirmed: secondary metrics get a verdict only after the primary is decided and multiple-testing correction (Holm) passes" }, "—")
  if (cls === "desc") return h("span", { title: "untested: measured for context, not statistically tested" }, "·")
  const [word, tag] = vsplit(c.verdict)
  if (word === "underpowered" || word === "unclear") return [h("span", {}, "inconclusive"), tag ? h("span", { class: "vt" }, " " + tag) : null]
  const cleanTag = tag === "small" ? "near ±2%" : tag
  return [h("span", {}, word), cleanTag ? h("span", { class: "vt" }, " " + cleanTag) : null]
}

const ROLE = {
  primary: "★ primary metric (declared before the run)",
  secondary: "secondary metric (confirmed only if primary decides and multiple-testing check passes)",
  descriptive: "context metric (measured, never tested)",
}

// Plain-language certainty badges: consistent across Feel cards, Notable moves, and All metrics.
function certainty(x, aa = isAA()) {
  const c = x.c
  const v = c.verdict || ""
  if (/^refused/.test(v)) return { text: "refused", short: "refused", tone: "warn", title: v }
  const clear = finite(c.lo) && finite(c.hi) && (c.lo > 0 || c.hi < 0)
  if (x.role === "descriptive") {
    return clear
      ? { text: "untested · moved", short: "untested", signal: true, tone: "signal", title: "Context metric (not statistically tested); its 95% range clears zero" }
      : { text: "untested", short: "untested", tone: "desc", title: "Context metric: measured for awareness, never statistically tested" }
  }
  if (c.decided) {
    const [word] = vsplit(v)
    if (aa && clear) {
      return { text: "false positive", short: "false pos", tone: "warn", title: "A/A check (same build on both sides): decided difference occurred by chance" }
    }
    const cls = vclass(c, c.metric, false)
    const w = word || "same"
    return { text: `decided · ${w}`, short: w, tone: cls === "better" || cls === "worse" ? cls : "same", title: `${ROLE[x.role]} — ${cleanVerdict(v)}` }
  }
  if (clear) {
    return { text: "unconfirmed", short: "unconfirmed", signal: true, tone: "signal", title: "95% range clears zero, but experiment stopped before enough pairs to confirm secondary metrics" }
  }
  return { text: "inconclusive", short: "inconclusive", tone: "gated", title: x.role === "primary" ? cleanVerdict(v) : "Too noisy or too few pairs to tell if this metric changed" }
}

const SINGLE = { text: "1 frame", short: "1 frame", tone: "single", title: "Single longest frame gap across all launches (1 frame out of thousands); noisy and untested" }
const badgeEl = (b, compact) => h("span", { class: "badge t-" + b.tone, title: b.title }, compact && b.short ? b.short : b.text)
const toneCls = (b) => (b.tone === "better" ? "c-better" : b.tone === "worse" ? "c-worse" : b.tone === "warn" ? "c-warn" : b.signal ? "c-signal" : "dim2")

function compRows(x) {
  const c = x.c
  const u = unitOf(c.metric)
  const about = aboutOf(c.metric)
  const extra = c.metric === "cpu.app.total" && finite(c.base) && finite(c.head)
    ? [["cores", `${(c.base / 100).toFixed(2)} → ${(c.head / 100).toFixed(2)} CPU cores`]]
    : []
  return [
    about ? ["what it is", about] : null,
    ["role", ROLE[x.role]],
    ["base", fmtValue(c.base, u) + "  (median across launches)"],
    ["head", fmtValue(c.head, u) + "  (median across launches)"],
    ...extra,
    ["paired Δ", `${fmtDelta(c.estimate, c, u)}  (${c.relative ? "Hodges–Lehmann paired % change" : "Hodges–Lehmann paired difference"})`],
    [x.role === "primary" ? `${ciPct(c.metric, { primary: c })}% range` : "95% range", fmtCI(c, u)],
    ["p-value", `${fmtP(c.p)}  (Wilcoxon signed-rank, ${c.n} pairs)`],
    ["threshold", fmtBound(c, u) + "  practical equivalence zone"],
    ["outcome", cleanVerdict(c.verdict), "c-" + vclass(c, c.metric)],
    finite(c.needed_pairs) && !c.decided ? ["pairs needed", `~${c.needed_pairs} pairs to decide ±2%`] : null,
  ]
}

/* ---------- data helpers ---------- */

const cleanPath = (p) => String(p || "").replace(/^\\\\\?\\/, "")
const baseName = (p) => cleanPath(p).split(/[\\/]/).pop()
const quote = (v) => (/^[\w.:/\\=@,+~-]+$/.test(v) ? v : `"${String(v).replace(/"/g, '\\"')}"`)
const variant = (r, role) => (r.variants || []).find((v) => v.role === role)
const timedBlocks = (s) => (s.blocks || []).filter((b) => finite(b.pair) && b.pair < 1e6)

function fmtTime(iso) {
  const d = new Date(iso)
  if (isNaN(d)) return String(iso || "")
  return d.toLocaleString(undefined, { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })
}

function fmtDuration(ms) {
  if (!finite(ms)) return "—"
  if (ms < 1000) return `${ms} ms`
  if (ms < 120000) return `${(ms / 1000).toFixed(1)} s`
  return `${(ms / 60000).toFixed(1)} min`
}

// Keep a branch or worktree prefix when it distinguishes the two sides; collapse duplicate sha@sha.
function shortVariant(v, other) {
  const label = String(v?.label || v?.spec || "").replace(/^git:/, "")
  if (label === ".") return "current dir"
  const sha = (x) => (/^[0-9a-f]{8,40}$/i.test(x) ? x.slice(0, 7) : x)
  const m = /^(.*?)@([0-9a-f]{7,40})(.*)$/i.exec(label)
  if (!m) return sha(label)
  const [, prefix, rev, rest] = m
  const otherPrefix = /^(.*?)@[0-9a-f]{7,40}/i.exec(String(other?.label || ""))?.[1]
  const keepPrefix = prefix && !/^[0-9a-f]{7,40}$/i.test(prefix) && !rev.startsWith(prefix) && prefix !== otherPrefix
  return (keepPrefix ? `${prefix} · ` : "") + sha(rev) + rest
}

function comparisons(s) {
  return [
    { c: s.primary, role: "primary" },
    ...(s.secondaries || []).map((c) => ({ c, role: "secondary" })),
    ...(s.descriptive || []).map((c) => ({ c, role: "descriptive" })),
  ].filter((x) => x.c && x.c.metric)
}

function pairsOf(s, metric, valueOf) {
  const blocks = timedBlocks(s)
  const by = new Map()
  blocks.forEach((b, i) => {
    const e = by.get(b.pair) || {}
    e[b.variant] = b
    e[b.variant + "At"] = i
    by.set(b.pair, e)
  })
  const get = valueOf || ((b) => b.values?.[metric])
  return [...by.entries()]
    .sort((x, y) => x[0] - y[0])
    .filter(([, e]) => e.base && e.head)
    .map(([pair, e]) => ({ pair, base: e.base, head: e.head, a: get(e.base), b: get(e.head), first: e.baseAt < e.headAt ? "base" : "head" }))
    .filter((p) => finite(p.a) && finite(p.b))
}

function displayHz(r, blocks) {
  const hz = median((blocks || []).map((b) => b.values?.["display.hz"]))
  return finite(hz) ? hz : finite(r.refresh_hz) ? r.refresh_hz : NaN
}

/* ---------- boot ---------- */

function render() {
  observers.forEach((o) => o.disconnect())
  observers = []
  linked = []
  if (timer) clearInterval(timer)
  timer = null
  hideTip()
  const key = document.activeElement?.dataset?.key
  const y = scrollY
  if (!STROBE || !STROBE.data) renderEmpty()
  else if (STROBE.view === "recording") renderRecording(STROBE.data)
  else renderExperiment(STROBE.data)
  // Paint charts now rather than waiting for ResizeObserver, which does not fire in hidden tabs.
  app.querySelectorAll(".chart").forEach((box) => box.measure())
  if (key) document.querySelector(`[data-key="${CSS.escape(key)}"]`)?.focus({ preventScroll: true })
  scrollTo(0, y)
}

function relink() {
  linked.forEach((f) => f())
}

function renderEmpty() {
  document.title = "strobe report"
  app.replaceChildren(
    h("header", { class: "top" }, h("span", { class: "brand" }, "strobe"), h("div", { class: "crumbs" }, h("span", { class: "dim" }, "report"))),
    h("div", { class: "empty" },
      h("div", {}, h("b", {}, "No data")),
      h("div", { class: "dim2" }, "This is the report template without an embedded result. Write a report from an experiment or a recording:"),
      cmdList([["an experiment", "strobe report experiment <exp_…> --open"], ["a recording", "strobe report recording <rec_…> --open"]])))
}

/* ---------- experiment ---------- */

function renderExperiment(r) {
  const series = r.series || []
  if (state.series >= series.length) state.series = 0
  const s = series[state.series]
  document.title = `strobe · ${r.id || "experiment"}${s ? " · " + s.label : ""}`
  const feel = s && !state.text ? feelModel(r, s) : null
  const moves = s && !state.text ? notable(s, feel).slice(0, 3) : []
  const hasWhy = !!(s?.hotspots?.base?.rows?.length && s?.hotspots?.head?.rows?.length)
  const jumps = ["feel", moves.length ? "moves" : null, hasWhy ? "why" : !moves.length ? "moves" : null, "evidence", "frames", "metrics", "env"].filter(Boolean)
  const header = h("header", { class: "top" },
    h("span", { class: "brand" }, "strobe"),
    h("div", { class: "crumbs" },
      h("span", { class: "mono id" }, r.id || "experiment"),
      r.file ? h("span", { class: "file", title: cleanPath(r.file) }, baseName(r.file)) : null,
      r.created ? h("span", { class: "time", title: r.created }, fmtTime(r.created)) : null),
    series.length > 1 && !state.text
      ? h("nav", { class: "tabs", role: "tablist", "aria-label": "series" }, series.map((x, i) =>
          h("button", { class: "tab st-" + vclass(x.primary, x.primary?.metric), role: "tab", "data-key": `series:${i}`, "aria-selected": String(i === state.series), title: `${nameOf(x.primary?.metric)}: ${cleanVerdict(x.primary?.verdict)}`, onclick: () => pickSeries(i) },
            h("i", { class: "sq" }), x.label || `series ${i + 1}`)))
      : null,
    r.plan?.aa ? h("span", { class: "aa", title: "Same build tested against itself: any 'decided' difference is random noise (a false positive)" }, "A/A control") : null,
    s && !state.text ? h("nav", { class: "jumps", "aria-label": "jump to a section" }, jumps.map((id, i) => [i ? "·" : null, h("button", { type: "button", onclick: () => jump(id) }, id)])) : null,
    h("button", { class: "toggle", type: "button", "data-key": "text", "aria-pressed": String(state.text), title: "Plain-text CLI summary", onclick: () => { state.text = !state.text; render() } }, "CLI text"))
  const main = h("main")
  app.replaceChildren(header, main)
  if (state.text) {
    main.append(textPanel(r.text || "(no text in this result)"))
    return
  }
  if (!s) {
    main.append(panel("No series", null, null, h("div", { class: "dim" }, "This experiment has no series.")))
    return
  }
  append(main, [
    warnBanner(r, s),
    hero(r, s),
    feelPanel(feel),
    ...middleSections(s, feel, moves, hasWhy),
    evidencePanel(s),
    framesPanel(r, s, feel),
    state.showDist ? distPanel(r, s) : null,
    metricsPanel(s),
    footerSection(r, s),
  ])
}

function warnBanner(r, s) {
  const real = [...(r.warnings || []), ...(s?.warnings || [])].filter((w) => w.level === "warn" || w.level === "error")
  if (!real.length) return null
  return h("div", { class: "alert st-warn" },
    h("i", { class: "sq" }),
    h("b", {}, real.length === 1 ? `Benchmark warning · ${real[0].id}` : `${real.length} benchmark warnings`),
    h("span", {}, real[0].text),
    real.length > 1 ? h("span", { class: "dim" }, `(+${real.length - 1} more)`) : null,
    h("button", { type: "button", class: "act", onclick: () => jump("env") }, "see notes"))
}

function jump(id) {
  const el = document.getElementById(id)
  if (!el) return
  if (el.tagName === "DETAILS") el.open = true
  el.scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" })
}

function pickSeries(i) {
  state.series = i
  state.focus = null
  state.k = null
  state.dist.phase = ""
  history.replaceState(null, "", "#series=" + i)
  render()
}

function setFocus(metric) {
  state.focus = metric
  state.k = null
  state.hoverK = null
  state.hoverFrom = null
  render()
}

function textPanel(text) {
  const copyBtn = h("button", { type: "button", onclick: (e) => copy(text, e.currentTarget) }, "copy")
  return panel("CLI summary", null, [copyBtn], h("pre", { class: "text" }, text), { flush: true })
}

/* hero: the declared primary, in plain words first */

function stopReason(s, c) {
  const raw = s.stopped || ""
  if (raw === "primary decided") {
    const looks = (STROBE?.data?.plan?.looks || []).filter(finite)
    const idx = looks.indexOf(s.pairs)
    return idx >= 0 && looks.length > 1 ? `decided at check ${idx + 1} of ${looks.length}` : "primary decided"
  }
  if (raw === "more pairs cannot decide it") {
    return finite(c?.needed_pairs) ? `pair budget reached (~${c.needed_pairs} pairs needed)` : "pair budget reached"
  }
  return raw || "—"
}

function hero(r, s) {
  const c = s.primary || {}
  const metric = c.metric || "?"
  const u = unitOf(metric)
  const aa = !!r.plan?.aa
  const cls = vclass(c, metric, aa)
  const [word, tag] = vsplit(c.verdict)
  const refused = /^refused/.test(c.verdict || "")
  const aaFalsePos = aa && c.decided && (c.lo > 0 || c.hi < 0)
  const open = cls === "inconc" || cls === "gated" || refused
  const real = (v) => (c.relative ? v * c.base : v)
  const pct = (v) => (c.relative ? fmtPct(v) : c.base > 0 ? fmtPct(v / c.base) : null)
  const change = open
    ? finite(c.needed_pairs) ? `~${c.needed_pairs} pairs needed for ${fmtBound(c, u, true)}` : "noise wider than threshold"
    : `${fmtSignedReal(real(c.estimate), c.base, u, true)}${pct(c.estimate) ? ` (${pct(c.estimate)})` : ""}`
  const base = variant(r, "base")
  const head = variant(r, "head")
  const audit = [`${s.pairs ?? "?"} pairs (${s.launches ?? "?"} fresh launches)`, `${fmtBound(c, u, true)} threshold`, `stopped: ${stopReason(s, c)}`, `p ${fmtP(c.p)}`].join(" · ")
  const changeEl = h("span", { class: "hero-num" + (open ? " open" : "") }, change)
  bindTip(changeEl, () => [nameOf(metric), [
    u === "%" && !open ? ["pts", "percentage points: head % minus base %"] : null,
    ...compRows({ c, role: "primary" }),
  ]])
  const looks = (r.plan?.looks || []).filter(finite)
  const pctLevel = ciPct(metric, s)
  const ciNote = looks.length > 1 && pctLevel > 95.1 ? `${pctLevel}% CI · ${looks.length}-check` : `${pctLevel}% CI`
  const ciBox = h("div", { class: "hero-ci" },
    h("div", { class: "ci-top" },
      h("span", {}, "Likely change  ", h("b", { class: "mono" }, fmtCI(c, u, " to ", true))),
      h("span", { class: "mono dim" }, `(${ciNote})`)),
    chart(46, (w) => heroBar(w, c, u)))
  bindTip(ciBox, () => ["Likely change range", [
    ["range", `${fmtCI(c, u, " to ")}  (${pctLevel}% confidence interval)`],
    looks.length > 1 && pctLevel > 95.1 ? ["why " + pctLevel + "%", `Adjusted across ${looks.length} planned checks (${looks.join(", ")} pairs) so overall false-positive risk stays ≤5%`] : null,
    ["shaded zone", `${fmtBound(c, u)} practical equivalence threshold`],
  ]])
  return h("section", { class: `panel hero sec st-${cls}`, id: "top" },
    h("div", { class: "hero-main" },
      h("div", { class: "hero-metric" },
        h("span", { class: "star" }, "★"),
        h("span", { class: "plain" }, nameOf(metric)),
        nameOf(metric) !== metric ? h("span", { class: "mono dim" }, metric) : null,
        s.label ? h("span", { class: "dim" }, `· ${s.label}`) : null,
        aa && !aaFalsePos ? h("span", { class: "dim2", title: "Same build tested on both sides to verify false-positive rate" }, "· A/A same-build check") : null),
      h("div", { class: "hero-line" },
        aaFalsePos ? h("span", { class: "chip warn", title: "Same build on both sides: this decided difference happened by random chance" }, "false positive (A/A)") : null,
        open ? h("span", { class: "chip" + (refused ? " warn" : ""), title: cleanVerdict(c.verdict) }, refused ? "refused" : "inconclusive") : h("span", { class: `hero-word c-${cls}` }, word || "—"),
        !open && !aaFalsePos && tag ? h("span", { class: "hero-tag", title: tag === "small" ? "Real effect, though possibly smaller than the ±2% practical threshold" : null }, tag === "small" ? "near ±2%" : tag) : null,
        changeEl),
      h("div", {}, takeaway(r, s, c)),
      h("div", { class: "audit mono", title: "p = Wilcoxon signed-rank p-value across paired launches" }, audit)),
    ciBox,
    h("dl", { class: "hero-vals", title: "Median across fresh launches of each build" },
      h("dt", {}, h("i", { class: "sw base" }), "base"), h("dd", { class: "v" }, fmtValue(c.base, u)), h("dd", { class: "mono dim", title: `${base?.label || ""}\n${base?.spec || ""}` }, shortVariant(base, head)),
      h("dt", {}, h("i", { class: "sw head" }), "head"), h("dd", { class: "v" }, fmtValue(c.head, u)), h("dd", { class: "mono dim", title: `${head?.label || ""}\n${head?.spec || ""}` }, shortVariant(head, base))))
}

// One plain-English sentence for any engineer, with zero unexplained jargon.
function takeaway(r, s, c) {
  const m = c.metric
  const u = unitOf(m)
  const cls = vclass(c, m, false)
  const [word, tag] = vsplit(c.verdict)
  const real = (v) => (c.relative ? v * c.base : v)
  const runMs = comparisons(s).find((x) => x.c.metric === "run.duration")?.c.base ?? median(timedBlocks(s).map((b) => b.values?.["run.duration"]))
  const per = m === "main.work" && finite(runMs) ? ` per ${fmtDuration(Math.round(runMs))} run` : ""
  const range = `${fmtSignedReal(real(c.lo), c.base, u, true)} to ${fmtSignedReal(real(c.hi), c.base, u, true)}`
  const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1)
  if (!finite(c.lo) || !finite(c.hi)) return "Not enough data to compute a change range."
  if (/^refused/.test(c.verdict || "")) return `Measurement refused (${c.verdict.replace(/^refused:\s*/, "")}).`
  if (r.plan?.aa && c.decided && (c.lo > 0 || c.hi < 0)) {
    return `Same build on both sides differed by ${ pctOrAbs(c, u) } by random chance (expected ~5% of A/A runs).`
  }
  if (cls === "same") return `Equivalent within ${fmtBound(c, u, true)} (true change is between ${range}${per}).`
  if (cls === "inconc" || cls === "gated") return `Too noisy over ${s.pairs ?? "?"} pairs to confirm a change (true difference is between ${range}${per}).`
  const amount = fmtReal(real(c.estimate), c.base, u, true)
  const nearRel = Math.min(Math.abs(c.lo), Math.abs(c.hi))
  const nearStr = u === "%" ? fmtPct(nearRel).replace(/^[+−]/, "") : fmtReal(Math.min(Math.abs(real(c.lo)), Math.abs(real(c.hi))), c.base, u, true)
  const now = fmtValue(c.head, u)
  const was = fmtValue(c.base, u)
  const thresh = num(+(Math.abs(c.bound) * 100).toPrecision(3)) + "%"
  const line = {
    "main.work": `${amount} ${word} main-thread work${per}`,
    "main.busy": `main thread was busy ${now} of the time instead of ${was}`,
    "cpu.app.total": `app processes used ${now} of one CPU core instead of ${was}`,
    "run.duration": `each run took ${now} instead of ${was}`,
    "interaction.p95": `95% of inputs reached the screen within ${now} instead of ${was}`,
    "interaction.p50": `half of all inputs reached the screen within ${now} instead of ${was}`,
    "scroll.latency.p95": `95% of scroll updates reached the screen within ${now} instead of ${was}`,
    "frames.dropped.pct": `${now} of display refreshes dropped a pending frame instead of ${was}`,
    "frames.interval.p95": `95% of frames followed the previous frame within ${now} instead of ${was}`,
    "memory.app.private": `${amount} ${word} app memory (${was} → ${now})`,
    "js.heap.used": `${amount} ${word} JS heap (${was} → ${now})`,
  }[m] ?? `${nameOf(m)}: ${now} instead of ${was}`
  return cap(line) + (tag === "small" ? ` (at least ${nearStr}${u === "%" ? " relative change" : ""}; possibly under the ${thresh} threshold).` : ".")
}

const pctOrAbs = (c, u) => (c.relative ? fmtPct(Math.abs(c.estimate)).replace(/^[+−]/, "") : fmtReal(c.estimate, c.base, u, true))

function heroBar(w, c, u) {
  const H = 46
  const svg = S("svg", { class: "plot", width: w, height: H, viewBox: `0 0 ${w} ${H}` })
  if (!finite(c.lo) || !finite(c.hi)) {
    svg.append(T(0, 24, "no interval", "lbl", "start"))
    return svg
  }
  const span = Math.max(Math.abs(c.lo), Math.abs(c.hi), Math.abs(c.estimate) || 0, Math.abs(c.bound) || 0) * 1.2 || 1
  const x = lin(-span, span, 14, w - 14)
  const fmt = (v) => (c.relative ? pctTick(+(v * 100).toPrecision(12)) : signedTick(v, absUnit(u)))
  const n = Math.max(2, Math.floor(w / 70))
  const ticks = c.relative ? niceTicks(-span * 100, span * 100, n).map((v) => v / 100) : niceTicks(-span, span, n)
  const cy = 16
  const b = Math.abs(c.bound)
  if (finite(b) && b > 0) {
    svg.append(S("rect", { x: x(-b), y: 4, width: x(b) - x(-b), height: 24, class: "band" }), L(x(-b), 4, x(-b), 28, "bandline"), L(x(b), 4, x(b), 28, "bandline"))
  }
  svg.append(L(14, 31, w - 14, 31, "grid"))
  for (const t of ticks) svg.append(L(x(t), 31, x(t), 34, "grid"), T(x(t), 44, fmt(t), null, "middle"))
  svg.append(L(x(0), 2, x(0), 31, "zero"))
  svg.append(
    S("line", { x1: x(c.lo), y1: cy, x2: x(c.hi), y2: cy, style: "stroke:var(--st)", "stroke-width": 3 }),
    S("line", { x1: x(c.lo), y1: cy - 6, x2: x(c.lo), y2: cy + 6, style: "stroke:var(--st)", "stroke-width": 1.5 }),
    S("line", { x1: x(c.hi), y1: cy - 6, x2: x(c.hi), y2: cy + 6, style: "stroke:var(--st)", "stroke-width": 1.5 }),
    finite(c.estimate) ? S("circle", { cx: x(c.estimate), cy, r: 4.5, style: "fill:var(--st)" }) : null)
  return svg
}

/* feel: the four user-perceptible dimensions */

function feelModel(r, s) {
  const blocks = timedBlocks(s)
  const hz = displayHz(r, blocks)
  const vs = hz > 0 ? 1000 / hz : NaN
  const fpl = median(blocks.map((b) => b.values?.["frames.n"]))
  const ipl = median(blocks.map((b) => (b.intervals ? b.intervals.length : NaN)))
  const hasStream = finite(ipl) ? ipl >= 30 : fpl >= 30
  const prim = s.primary?.metric
  const items = comparisons(s)
  const row = (metric, label) => {
    const x = items.find((y) => y.c.metric === metric)
    return x ? { metric, label: label || nameOf(metric), x } : null
  }
  const lead = (rows) => {
    const list = rows.filter(Boolean)
    const i = list.findIndex((x) => x.metric === prim)
    if (i > 0) list.unshift(...list.splice(i, 1))
    return list
  }
  const input = row("interaction.p95") || row("scroll.latency.p95")
  const taskRow = row("run.duration", "task time")
  const task = taskRow && taskRow.x.role !== "descriptive" ? taskRow : null
  const renderP95 = !hasStream && fpl >= 30 ? row("frames.presented.p95", "render p95") : null
  const cards = [
    {
      title: "Smoothness",
      rows: hasStream ? lead([row("frames.dropped.pct"), row("frames.interval.p95", "gap p95"), worstGap(blocks, vs)]) : [],
      altRows: renderP95 ? [renderP95] : [],
      empty: !hasStream && fpl >= 30
        ? ["discrete updates", `~${Math.round(fpl)} isolated paints/launch (no continuous stream)`]
        : finite(fpl) && fpl > 0
          ? ["sparse", `~${Math.round(fpl)} frames/launch (<30 min for smoothness)`]
          : ["not exercised", "no frames recorded"],
    },
    {
      title: "Responsiveness",
      rows: input ? lead([input, input.metric === "interaction.p95" ? row("interaction.p50", "input p50") : null, task]) : task ? [task] : [],
      empty: ["not exercised", "passive case (no discrete inputs or timed task)"],
    },
    {
      title: "Work",
      rows: lead([row("main.work", "work ms"), row("main.busy", "busy %"), row("cpu.app.total", "total CPU")]),
      empty: ["—", "no main-thread values"],
    },
    {
      title: "Memory",
      rows: lead([row("memory.app.private", "app memory (RAM)"), row("js.heap.used", "JS heap")]),
      empty: ["—", "no memory values"],
    },
  ]
  const headlines = new Set(cards.map((cd) => cd.rows[0]?.metric).filter(Boolean))
  return { s, cards, prim, vs, hz, fpl, ipl, hasStream, blocks, headlines, metrics: new Set(cards.flatMap((cd) => cd.rows.map((x) => x.metric))) }
}

function worstGap(blocks, vs) {
  const best = (v) => {
    let top = null
    for (const b of blocks) {
      const val = b.values?.["frames.interval.max"]
      if (b.variant === v && finite(val) && (!top || val > top.val)) top = { val, pair: b.pair + 1, rec: b.recording }
    }
    return top
  }
  const b = best("base")
  const hd = best("head")
  if (!b || !hd) return null
  return { metric: "frames.interval.max", label: "max gap", single: true, base: b.val, head: hd.val, baseHit: b, headHit: hd, vs }
}

function feelPanel(feel) {
  return h("section", { id: "feel", class: "feel sec" }, feel.cards.map((cd) => feelCard(cd, feel)))
}

function feelCard(cd, feel) {
  const [big, ...subs] = cd.rows
  if (!big || big.single) {
    return h("div", { class: "card" },
      h("div", { class: "ct" }, h("span", { class: "cn" }, cd.title)),
      h("div", { class: "cbig" }, h("span", { class: "big muted" }, cd.empty[0])),
      h("div", { class: "cap" }, cd.empty[1]),
      (cd.altRows || []).map((x) => subRow(x, feel)))
  }
  const c = big.x.c
  const u = unitOf(c.metric)
  const b = certainty(big.x)
  const cdlt = coherentDelta(c, u, true)
  const sp = diffSpark(pairsOf(feel.s, c.metric), c)
  if (sp) bindTip(sp, () => [`${nameOf(c.metric)} per pair`, [["bars", "head vs base in each pair"], ["blue", "head was better in that pair"], ["shaded", fmtBound(c, u, true) + " practical threshold"]]])
  const head = h("div", { class: "cbig" },
    h("span", { class: "big" }, fmtValue(c.head, u)),
    h("span", { class: "mono " + (cdlt.noisy ? "dim" : toneCls(b)) }, cdlt.text),
    sp)
  bindTip(head, () => [nameOf(c.metric), [
    cdlt.noisy ? ["note", `Launch medians (${fmtValue(c.base, u)} → ${fmtValue(c.head, u)}) vs noisy paired estimate (${cdlt.raw}); interval crosses zero`] : null,
    ...compRows(big.x),
  ]])
  return h("div", { class: "card" },
    h("div", { class: "ct" }, h("span", { class: "cn" }, cd.title, big.metric === feel.prim ? h("span", { class: "star", title: "Declared primary metric" }, " ★") : null), badgeEl(b)),
    head,
    h("div", { class: "cap", title: aboutOf(c.metric) || c.metric }, `${nameOf(c.metric)} · was ${fmtValue(c.base, u)}`),
    subs.map((x) => subRow(x, feel)))
}

function subRow(x, feel) {
  if (x.single) {
    const vs = feel.vs
    const frames = finite(vs) ? ` (${Math.round(x.base / vs)}→${Math.round(x.head / vs)}f)` : ""
    const el = h("div", { class: "srow" },
      h("span", { class: "sl" }, x.label),
      h("span", { class: "sv mono" }, `${fmtMove(x.base, x.head, "ms")}`, frames ? h("span", { class: "dim" }, frames) : null),
      badgeEl(SINGLE, true))
    return bindTip(el, () => ["max frame gap (worst single freeze)", [
      ["base", `${fmtValue(x.base, "ms")}  (pair ${x.baseHit.pair}${x.baseHit.rec ? " · " + x.baseHit.rec : ""})`],
      ["head", `${fmtValue(x.head, "ms")}  (pair ${x.headHit.pair}${x.headHit.rec ? " · " + x.headHit.rec : ""})`],
      finite(vs) ? ["refreshes", `${(x.base / vs).toFixed(1)}× → ${(x.head / vs).toFixed(1)}× display refresh (${short(vs)} ms)`] : null,
      ["certainty", "1 frame out of thousands: shown for awareness, never statistically tested"],
    ]])
  }
  const c = x.x.c
  const u = unitOf(c.metric)
  const b = certainty(x.x)
  const cdlt = coherentDelta(c, u, true)
  const el = h("div", { class: "srow" },
    h("span", { class: "sl", title: c.metric }, x.label),
    h("span", { class: "sv mono" }, fmtMove(c.base, c.head, u), h("span", { class: cdlt.noisy ? "dim" : toneCls(b) }, "  " + cdlt.text)),
    badgeEl(b, true))
  return bindTip(el, () => [nameOf(c.metric), [
    cdlt.noisy ? ["note", `Launch medians (${fmtValue(c.base, u)} → ${fmtValue(c.head, u)}) vs noisy paired estimate (${cdlt.raw}); interval crosses zero`] : null,
    ...compRows(x.x),
  ]])
}

function diffSpark(ps, c, w = 84, H = 22) {
  const rel = c.relative !== false
  const d = ps.map((p) => (rel ? p.b / p.a - 1 : p.b - p.a)).filter(finite)
  if (!d.length) return null
  const bnd = Math.abs(c.bound)
  const m = Math.max(...d.map(Math.abs), finite(bnd) ? bnd : 0) || 1
  const y = lin(-m, m, H - 1, 1)
  const svg = S("svg", { class: "spark", width: w, height: H, viewBox: `0 0 ${w} ${H}` })
  if (finite(bnd) && bnd > 0) svg.append(S("rect", { x: 0, y: y(bnd), width: w, height: y(-bnd) - y(bnd), class: "band" }))
  svg.append(L(0, y(0), w, y(0), "zero"))
  const step = w / d.length
  const bw = Math.max(1, Math.min(6, step - 1))
  d.forEach((v, i) => {
    const better = higherBetter(c.metric) ? v > 0 : v < 0
    svg.append(S("rect", { x: i * step + (step - bw) / 2, y: Math.min(y(0), y(v)), width: bw, height: Math.max(1, Math.abs(y(v) - y(0))), class: better ? "sp-b" : "sp-o" }))
  })
  return svg
}

/* middle: takeaways (notable moves) and reasons (why CPU hotspots) */

function middleSections(s, feel, moves, hasWhy) {
  if (!moves.length && !hasWhy) {
    const reason = vclass(s.primary, s.primary?.metric, false) === "same"
      ? "no other metrics shifted clearly; CPU profiling skipped because primary was equivalent"
      : "no other metrics shifted clearly; CPU profiling runs only when the primary decides a difference"
    return [h("section", { id: "moves", class: "panel stub sec" }, h("div", { class: "ph" }, h("h2", {}, "Notable moves & Why"), h("span", { class: "sub" }, reason)))]
  }
  return [
    moves.length ? panel("Notable moves", "other metrics whose 95% range clears zero (plus large single-frame tail shifts), ranked by signal-to-noise", null, h("div", { class: "chips" }, moves.map(moveChip)), { id: "moves", cls: "sec" }) : null,
    hasWhy ? whySection(s) : null,
  ].filter(Boolean)
}

function notable(s, feel) {
  const vs = feel.vs
  const bound = finite(s.bound) ? s.bound : 0.02
  const all = comparisons(s)
  const byMetric = new Map(all.map((x) => [x.c.metric, x.c]))
  const out = []
  for (const x of all) {
    const c = x.c
    // Skip only the declared primary and Feel card top headlines that already show big numbers.
    if (x.role === "primary" || feel.headlines.has(c.metric)) continue
    if (/^refused/.test(c.verdict || "") || !finite(c.lo) || !finite(c.hi) || !finite(c.estimate) || !(c.lo > 0 || c.hi < 0)) continue
    // Suppress quantized .p50 frame jumps (1 vsync <-> 2 vsync boundary) unless .p95 also moved past the threshold in the same direction.
    if (/^frames\.(presented|interval)\.p50$/.test(c.metric)) {
      const p95 = byMetric.get(c.metric.replace(/\.p50$/, ".p95"))
      if (!p95 || !(p95.lo > 0 || p95.hi < 0) || Math.abs(p95.estimate) < bound || Math.sign(p95.estimate) !== Math.sign(c.estimate)) continue
    }
    const u = unitOf(c.metric)
    const absD = c.relative ? c.estimate * c.base : c.estimate
    const relD = c.relative ? c.estimate : c.base ? c.estimate / Math.abs(c.base) : NaN
    const big = (rel, abs) => Math.abs(rel) >= bound && (u !== "MB" || Math.abs(abs) >= 10) && (!(u === "ms" && c.metric.startsWith("frames.") && finite(vs)) || Math.abs(abs) >= vs * 0.5)
    const medD = c.head - c.base
    if (!big(relD, absD) || !big(c.base ? medD / Math.abs(c.base) : NaN, medD) || Math.sign(medD) !== Math.sign(c.estimate)) continue
    const b = certainty(x)
    out.push({
      score: Math.abs(c.estimate) / Math.max(1e-12, c.hi - c.lo),
      label: nameOf(c.metric),
      sub: `${c.metric} · 95% range ${fmtCI(c, u, " to ", true)}`,
      base: c.base, head: c.head, u, rel: relD,
      delta: fmtDelta(c.estimate, c, u, true),
      badge: b, vs, tip: compRows(x),
    })
  }
  const missed = missedMove(s, feel)
  if (missed && Math.abs(missed.rel) >= bound) out.push(missed)
  const wg = feel.hasStream ? worstGap(feel.blocks, vs) : null
  if (wg && finite(vs) && Math.abs(wg.head - wg.base) >= vs * 0.9 && Math.abs(wg.head - wg.base) / Math.max(wg.base, wg.head) >= 0.25) {
    const pct = fmtPct(wg.head / wg.base - 1)
    out.push({
      score: 0.35, // Always rank single-frame tail shifts after multi-launch CI-clear metrics.
      label: "max frame gap (worst freeze)",
      sub: `frames.interval.max · ${Math.round(wg.base / vs)}× → ${Math.round(wg.head / vs)}× display refresh · 1 frame`,
      base: wg.base, head: wg.head, u: "ms", rel: wg.head / wg.base - 1,
      delta: pct, badge: SINGLE, vs,
      tip: [
        ["what it is", "Single longest gap between presented frames across all launches"],
        ["base", `${fmtValue(wg.base, "ms")}  (pair ${wg.baseHit.pair}${wg.baseHit.rec ? " · " + wg.baseHit.rec : ""})`],
        ["head", `${fmtValue(wg.head, "ms")}  (pair ${wg.headHit.pair}${wg.headHit.rec ? " · " + wg.headHit.rec : ""})`],
        ["certainty", "1 frame out of thousands: noisy and never statistically tested"],
      ],
    })
  }
  return out.sort((a, b) => b.score - a.score)
}

function missedMove(s, feel) {
  const vs = feel.vs
  if (!finite(vs) || !feel.hasStream) return null
  const share = (b) => (b.intervals?.length ? (100 * (b.intervals.length - upper(Float64Array.from(b.intervals).sort(), 1.5 * vs))) / b.intervals.length : NaN)
  const ps = pairsOf(s, null, share)
  if (ps.length < 2) return null
  const cmp = compareAt("frames.missed", ps, s.bound ?? 0.02, false, 0.05)
  if (!cmp || !(cmp.lo > 0 || cmp.hi < 0)) return null
  const data = distData(s, "gaps", "")
  const pooled = (a) => (a.length ? (100 * (a.length - upper(a, 1.5 * vs))) / a.length : NaN)
  const base = pooled(data.pooled.base)
  const head = pooled(data.pooled.head)
  if (!(base > 0) || !finite(head) || Math.sign(head - base) !== Math.sign(cmp.est)) return null
  return {
    score: Math.abs(cmp.est) / Math.max(1e-12, cmp.hi - cmp.lo), rel: head / base - 1,
    label: "multi-refresh gaps",
    sub: `gaps > 1.5× refresh · 95% range ${fmtSigned(cmp.lo, "pts")} to ${fmtSigned(cmp.hi, "pts")}`,
    base, head, u: "%", vs: NaN,
    delta: `${fmtSigned(head - base, "pts")}`,
    badge: { text: "untested · moved", short: "untested", signal: true, tone: "signal", title: "Derived from pooled frame gaps; 95% pair range clears zero, not part of test plan" },
    tip: [
      ["what it is", "Share of frame-to-frame gaps longer than 1.5 display refreshes (at least 1 skipped refresh)"],
      ["base", fmtValue(base, "%") + "  (pooled across launches)"],
      ["head", fmtValue(head, "%") + "  (pooled across launches)"],
      ["paired 95% range", `${fmtSigned(cmp.lo, "pts")} to ${fmtSigned(cmp.hi, "pts")}`],
      ["certainty", "Untested context metric (not part of the pre-declared test plan)"],
    ],
  }
}

function moveChip(m) {
  const el = h("div", { class: "mchip" },
    h("div", { class: "ct" }, h("span", { class: "cn" }, m.label), badgeEl(m.badge)),
    h("div", { class: "mval" }, h("span", { class: "mv" }, fmtMove(m.base, m.head, m.u)), h("span", { class: "mono " + (m.badge === SINGLE ? "dim2" : toneCls(m.badge)) }, m.delta)),
    chart(18, (w) => moveBar(w, m)),
    h("div", { class: "mono dim", style: "overflow:hidden;text-overflow:ellipsis;white-space:nowrap" }, m.sub))
  return bindTip(el, () => [m.label, m.tip])
}

// Proportional base vs head comparison bar so a 3% shift looks small and a 50% shift looks wide.
function moveBar(w, m) {
  const H = 18
  const svg = S("svg", { class: "plot", width: w, height: H, viewBox: `0 0 ${w} ${H}` })
  const top = Math.max(m.base, m.head, 1e-9) * 1.06
  const x = lin(0, top, 4, w - 4)
  svg.append(
    S("rect", { x: 4, y: 3, width: Math.max(2, x(m.base) - 4), height: 5, fill: "var(--base)", "fill-opacity": 0.65 }),
    S("rect", { x: 4, y: 10, width: Math.max(2, x(m.head) - 4), height: 5, fill: "var(--head)" }))
  return svg
}

// Strip bundler content hashes (e.g. file-oSEU804T.js -> file.js) and line numbers when pairing base vs head chunks.
function normChunk(w) {
  return String(w || "")
    .replace(/:\d+$/, "")
    .replace(/-[A-Za-z0-9_-]{6,12}(?=\.(?:m?js|cjs|css)$)/, "")
}

function groupHotspots(list, byFile, div) {
  const map = new Map()
  for (const x of list || []) {
    const key = byFile ? normChunk(x.name) : `${x.name}\0${normChunk(x.where)}`
    const cur = map.get(key)
    if (!cur) map.set(key, { name: byFile ? normChunk(x.name) : x.name, where: x.where, self_ms: x.self_ms / div, share: x.share || 0, share_ci: x.share_ci || 0 })
    else {
      cur.self_ms += x.self_ms / div
      cur.share += x.share || 0
      cur.share_ci = Math.hypot(cur.share_ci, x.share_ci || 0)
    }
  }
  return map
}

function whySection(s) {
  const hs = s.hotspots
  const byFile = state.whyBy === "file" && hs.base.files?.length && hs.head.files?.length
  const listB = byFile ? hs.base.files : hs.base.rows
  const listH = byFile ? hs.head.files : hs.head.rows
  const runsB = hs.base.runs || STROBE?.data?.plan?.runs_per_block || 1
  const runsH = hs.head.runs || STROBE?.data?.plan?.runs_per_block || 1
  const perRun = finite(runsB) && runsB > 0 && finite(runsH) && runsH > 0
  const divB = perRun ? runsB : 1
  const divH = perRun ? runsH : 1
  const unitSuffix = perRun ? " ms/run" : " ms"
  const sys = (n) => /^\((idle|program|garbage collector|root)\)$/.test(n)
  const B = groupHotspots(listB, byFile, divB)
  const H = groupHotspots(listH, byFile, divH)
  const floorB = Math.min(...listB.map((x) => x.self_ms / divB))
  const floorH = Math.min(...listH.map((x) => x.self_ms / divH))
  const allRows = [...new Set([...B.keys(), ...H.keys()])].map((k) => {
    const b = B.get(k)
    const hd = H.get(k)
    const name = (hd || b).name
    if (sys(name)) return null
    const bv = b ? b.self_ms : floorB
    const hv = hd ? hd.self_ms : floorH
    const delta = hv - bv
    const known = !!(b && hd) || (!b && delta > 0) || (!hd && delta < 0)
    return known ? { n: name, b, hd, bv, hv, delta, where: (hd || b).where } : null
  }).filter(Boolean).sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta))
  const strong = allRows.filter((x) => Math.abs(x.delta) >= 0.25)
  const rows = (strong.length >= 2 ? strong : allRows).slice(0, 6)
  const scale = Math.max(...rows.map((x) => Math.abs(x.delta)), 1e-9) * 1.05
  const P = (v) => 50 + (v / scale) * 50
  const where = (w) => {
    const v = String(w || "")
    if (!v || /^\(native\)/.test(v)) return v ? "native" : ""
    const tail = normChunk(v).split("/").pop()
    const ln = /:\d+$/.exec(v)?.[0] || ""
    const full = tail + ln
    return full.length > 40 ? "…" + full.slice(-39) : full
  }
  const sysMapB = new Map(hs.base.rows.map((x) => [x.name, x]))
  const sysMapH = new Map(hs.head.rows.map((x) => [x.name, x]))
  const sysRows = ["(program)", "(garbage collector)"].map((n) => [n, sysMapB.get(n), sysMapH.get(n)]).filter(([, b, hd]) => b || hd)
  const workB = hs.base.values?.["main.work"]
  const workH = hs.head.values?.["main.work"]
  const primEst = s.primary?.estimate
  const drifted = finite(workB) && finite(workH) && finite(primEst) && s.primary?.decided && Math.sign(workH - workB) !== 0 && Math.sign(workH - workB) !== Math.sign(primEst)
  const ctl = hs.base.files?.length && hs.head.files?.length
    ? [seg("why", [["fn", "by function"], ["file", "by file"]], state.whyBy, (v) => { state.whyBy = v; render() }, "group hotspots"), badgeEl({ text: "1 launch / side · untested", tone: "desc", title: "Profiled in one separate launch per build so profiler overhead never perturbs timed runs" })]
    : [badgeEl({ text: "1 launch / side · untested", tone: "desc", title: "Profiled in one separate launch per build" })]
  return h("section", { id: "why", class: "panel sec" },
    h("div", { class: "ph" },
      h("h2", {}, "Why"),
      h("span", { class: "sub" }, `sampled CPU self-time${perRun ? " per run" : ""} · where head spent less (blue) or more (dark grey)`),
      h("div", { class: "ctl" }, ctl)),
    drifted ? h("div", { class: "wnote" }, `Note: CPU profiling runs in 1 separate launch per build with V8's profiler attached (total main-thread work in that single pair was ${short(workB)} → ${short(workH)} ms/run, vs ${s.pairs}-pair timed runs above).`) : null,
    h("div", { class: "wrow wh" }, h("span", {}, byFile ? "file / script" : "function"), h("span", { class: "wv" }, "base → head"), h("span", {}, "← less in head · more in head →"), h("span", { class: "num" }, perRun ? "Δ / run" : "Δ")),
    rows.map((x) => {
      const l = Math.min(P(0), P(x.delta))
      const el = h("div", { class: "wrow" },
        h("div", { class: "wname" }, h("span", { class: "mono n" }, x.n), !byFile ? h("span", { class: "mono w" }, where(x.where)) : null),
        h("span", { class: "mono wv" }, `${x.b ? short(x.bv) : "<" + short(floorB)} → ${x.hd ? short(x.hv) : "<" + short(floorH)} ms`),
        h("div", { class: "wbar" },
          h("i", { class: "z" }),
          h("i", { class: "bar" + (x.delta > 0 ? " more" : ""), style: `left:${l}%;width:${Math.max(0.5, Math.abs(P(x.delta) - P(0)))}%` })),
        h("span", { class: "mono num" }, `${x.b && x.hd ? "" : x.delta > 0 ? "≥ " : "≤ "}${fmtSigned(x.delta, "ms")}`))
      return bindTip(el, () => [x.n, [
        !byFile && x.where ? ["location", x.where] : null,
        ["base", x.b ? `${fmtValue(x.bv, "ms")}${perRun ? "/run" : ""}  (${fmtShare(x.b.share)} ±${fmtShare(x.b.share_ci)} of samples)` : `below top list (< ${fmtValue(floorB, "ms")})`],
        ["head", x.hd ? `${fmtValue(x.hv, "ms")}${perRun ? "/run" : ""}  (${fmtShare(x.hd.share)} ±${fmtShare(x.hd.share_ci)} of samples)` : `below top list (< ${fmtValue(floorH, "ms")})`],
        ["difference", `${x.b && x.hd ? "" : x.delta > 0 ? "at least " : "at most "}${fmtSigned(x.delta, "ms")}${perRun ? " per run" : ""}`],
        ["recordings", `${hs.base.recording || "base"} → ${hs.head.recording || "head"} (${runsB} runs/launch)`],
      ]])
    }),
    h("div", { class: "wsys mono" },
      sysRows.map(([n, b, hd], i) => [i ? " · " : "", `${n} ${b ? short(b.self_ms / divB) : "—"} → ${hd ? short(hd.self_ms / divH) : "—"}${unitSuffix}`]),
      sysRows.length ? " · " : "", `${hs.base.samples ?? "?"} / ${hs.head.samples ?? "?"} samples across ${runsB} runs · idle excluded`))
}

/* evidence: pair by pair */

function evidencePanel(s) {
  const items = comparisons(s)
  const metric = items.some((x) => x.c.metric === state.focus) ? state.focus : s.primary?.metric
  const comp = items.find((x) => x.c.metric === metric)?.c
  const relative = comp ? comp.relative !== false : true
  const ps = pairsOf(s, metric)
  const P = ps.length
  const d = ps.map((p) => (relative ? p.b / p.a - 1 : p.b - p.a))
  const cum = ps.map((_, i) => (i < 1 ? null : compareAt(metric, ps.slice(0, i + 1), s.bound ?? 0.02, relative, levelOf(metric, s))))
